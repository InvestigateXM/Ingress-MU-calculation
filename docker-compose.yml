services:
  mu:
    build: .
    # The s2geometry wheel is published for Linux x86-64 only.
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MU_TABLE_MAX_LEVEL: ${MU_TABLE_MAX_LEVEL:-6}
      MU_TABLE_WORKERS: ${MU_TABLE_WORKERS:-6}
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
    volumes:
      - population:/data/grump
    restart: unless-stopped
volumes:
  population:
